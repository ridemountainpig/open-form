<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='t' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232e2e33'/%3E%3Cstop offset='1' stop-color='%23050506'/%3E%3C/linearGradient%3E%3ClinearGradient id='s' gradientUnits='userSpaceOnUse' x1='7' y1='6' x2='25' y2='26'%3E%3Cstop offset='0' stop-color='%23fff'/%3E%3Cstop offset='.55' stop-color='%23dadadf'/%3E%3Cstop offset='1' stop-color='%238e8e97'/%3E%3C/linearGradient%3E%3ClinearGradient id='h' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23fff' stop-opacity='.32'/%3E%3Cstop offset='.4' stop-color='%23fff' stop-opacity='.06'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23t)'/%3E%3Crect x='.5' y='.5' width='31' height='31' rx='7.5' fill='none' stroke='url(%23h)'/%3E%3Cg fill='url(%23s)'%3E%3Cpath d='M10.4 10.9v1.8m0 4.2V18' fill='none' stroke='url(%23s)' stroke-opacity='.22' stroke-width='1.5'/%3E%3Ccircle cx='10.4' cy='8.8' r='2.1' fill-opacity='.45'/%3E%3Crect x='15' y='7.7' width='9' height='2.2' rx='1.1' fill-opacity='.28'/%3E%3Ccircle cx='10.4' cy='14.8' r='2.1' fill-opacity='.45'/%3E%3Crect x='15' y='13.7' width='6.5' height='2.2' rx='1.1' fill-opacity='.28'/%3E%3Ccircle cx='10.4' cy='21.6' r='3.6'/%3E%3Crect x='15' y='20.5' width='10' height='2.2' rx='1.1'/%3E%3C/g%3E%3Cpath d='M8.9 21.7l1.05 1.05 2-2.2' fill='none' stroke='%230a0a0a' stroke-width='1.45' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <title>Open Form</title>
    <style>
      html {
        background: #f4f4f6;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #0b0b0e;
        }
      }
      html[data-studio-scheme="light"] {
        background: #f4f4f6;
      }
      html[data-studio-scheme="dark"] {
        background: #0b0b0e;
      }
    </style>
    <script>
      // Studio's light/dark choice, applied before first paint. Public forms
      // always follow the respondent's system setting instead.
      (() => {
        try {
          if (!location.pathname.startsWith('/studio')) return;
          const pref = localStorage.getItem('open-form:studio-scheme');
          const dark =
            pref === 'dark' ||
            (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.studioScheme = dark ? 'dark' : 'light';
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
